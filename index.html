<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мир профессий — викторина</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --stripe-a: #ffb703;
    --stripe-b: #ffa51a;
    --ink: #3a2200;
    --ink-soft: #7a4b00;
    --card: #fffaf0;
    --card-2: #fff1cf;
    --line: #f0c46a;
    --brand: #1f5c8a;
    --brand-2: #2b78b0;
    --gold: #ffd54a;
    --ok: #15803d;
    --ok-bg: #dcfce7;
    --bad: #b91c1c;
    --bad-bg: #fee2e2;
    --shadow: 0 8px 24px rgba(120, 60, 0, .25);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --stripe-a: #8a4f00;
      --stripe-b: #7a4400;
      --ink: #fff1d6;
      --ink-soft: #f1cf94;
      --card: #2c1f0e;
      --card-2: #3d2b12;
      --line: #6b4a1a;
      --brand: #3b82c4;
      --brand-2: #5a9ad6;
      --gold: #ffd54a;
      --ok: #86efac;
      --ok-bg: #12331f;
      --bad: #fca5a5;
      --bad-bg: #3b1414;
      --shadow: 0 8px 24px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --stripe-a: #8a4f00;
    --stripe-b: #7a4400;
    --ink: #fff1d6;
    --ink-soft: #f1cf94;
    --card: #2c1f0e;
    --card-2: #3d2b12;
    --line: #6b4a1a;
    --brand: #3b82c4;
    --brand-2: #5a9ad6;
    --gold: #ffd54a;
    --ok: #86efac;
    --ok-bg: #12331f;
    --bad: #fca5a5;
    --bad-bg: #3b1414;
    --shadow: 0 8px 24px rgba(0, 0, 0, .5);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0; min-height: 100%;
    color: var(--ink);
    font-family: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background-color: var(--stripe-a);
    background-image: repeating-linear-gradient(135deg, var(--stripe-a) 0 32px, var(--stripe-b) 32px 64px);
    background-attachment: fixed;
  }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 1.25rem; box-shadow: var(--shadow); }
  .brand-title { color: var(--brand); }
  .cell {
    min-width: 4.25rem; height: 3.5rem; padding: 0 .75rem;
    background: var(--brand); color: var(--gold);
    font-weight: 900; font-size: 1.5rem; border-radius: .9rem;
    border: 3px solid var(--brand-2); box-shadow: 0 4px 0 rgba(0,0,0,.25);
    transition: transform .12s ease, filter .12s ease;
    cursor: pointer;
  }
  .cell:hover:not(:disabled) { transform: translateY(-2px) scale(1.05); filter: brightness(1.1); }
  .cell:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .cell:disabled { cursor: default; box-shadow: none; }
  .cell-ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); font-size: 1rem; }
  .cell-bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); font-size: 1rem; }
  .btn {
    background: var(--brand); color: #fff; font-weight: 800; border-radius: .9rem;
    padding: .8rem 1.4rem; border: 3px solid var(--brand-2); box-shadow: 0 4px 0 rgba(0,0,0,.25);
    transition: transform .12s ease, filter .12s ease; cursor: pointer;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost {
    background: var(--card-2); color: var(--ink); border: 2px solid var(--line); border-radius: .8rem;
    padding: .4rem .8rem; font-weight: 700; cursor: pointer; font-size: .85rem;
  }
  .btn-ghost:hover { filter: brightness(.96); }
  .opt {
    width: 100%; text-align: left; display: flex; align-items: center; gap: .75rem;
    padding: .8rem 1rem; border-radius: 1rem; font-weight: 700; font-size: 1.05rem;
    background: var(--card-2); border: 3px solid var(--line); color: var(--ink);
    transition: transform .12s ease, border-color .12s ease; cursor: pointer;
  }
  .opt:hover:not(:disabled) { border-color: var(--brand); transform: translateX(3px); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    flex: none; width: 2.1rem; height: 2.1rem; border-radius: 999px; display: grid; place-items: center;
    background: var(--brand); color: #fff; font-weight: 900;
  }
  .opt-ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); animation: glow 1s ease-in-out 3; }
  .opt-ok .letter { background: var(--ok); color: var(--ok-bg); }
  .opt-bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); animation: shake .5s ease; }
  .opt-bad .letter { background: var(--bad); color: var(--bad-bg); }
  .opt-dim { opacity: .55; }
  .pop { animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; }
  .plus-fly {
    position: absolute; left: 50%; top: 22%; z-index: 5; pointer-events: none;
    font-weight: 900; font-size: 3rem; color: #16a34a; white-space: nowrap;
    text-shadow: 0 3px 0 rgba(255,255,255,.9), 0 6px 18px rgba(22,163,74,.55);
    animation: floatUp 1.8s ease-out forwards;
  }
  .bump { display: inline-block; animation: bump .6s ease; }
  .confetti { position: fixed; top: -20px; width: 10px; height: 16px; z-index: 80; pointer-events: none; animation: fall linear forwards; }
  @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes floatUp {
    0% { transform: translate(-50%, 20px) scale(.5); opacity: 0; }
    20% { transform: translate(-50%, 0) scale(1.25); opacity: 1; }
    70% { transform: translate(-50%, -50px) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -110px) scale(.9); opacity: 0; }
  }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } 50% { box-shadow: 0 0 0 8px rgba(34,197,94,.35); } }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.5); color: #16a34a; } 100% { transform: scale(1); } }
  @keyframes fall { 0% { transform: translateY(-5vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: .9; } }
  @keyframes pulseRed { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  .timer-low { animation: pulseRed .6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>

const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};


// ---- проверка текстового ответа: без регистра, без ё, с допуском на опечатку ----
const norm = (s) => String(s).toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-яәіңғүұқөһ0-9\s]/g, " ").replace(/\s+/g, " ").trim();
function dist(a, b) { // расстояние Дамерау–Левенштейна
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length];
}
function isCorrect(input, accept) {
  const n = norm(input || "");
  if (!n) return false;
  return accept.some((a) => {
    const na = norm(a);
    if (n === na) return true;
    const tol = na.length >= 9 ? 2 : na.length >= 5 ? 1 : 0;
    if (dist(n, na) <= tol) return true;
    return na.length >= 4 && (" " + n + " ").includes(" " + na + " ");
  });
}

const emptyState = { name: "", answered: {}, pending: null, mood: null, finishedAt: null };

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return emptyState;
    const s = { ...emptyState, ...JSON.parse(raw) };
    // Если страницу обновили посреди вопроса — вопрос считается пропущенным
    if (s.pending && !s.answered[s.pending] && BY_ID[s.pending]) {
      s.answered = { ...s.answered, [s.pending]: { ok: false, reason: "skipped" } };
    }
    s.pending = null;
    return s;
  } catch (e) {
    return emptyState;
  }
}

let audioCtx = null;
function tone(freqs, dur = 0.14, type = "sine", vol = 0.18) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    freqs.forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t0 + i * dur);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + (i + 1) * dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + i * dur); o.stop(t0 + (i + 1) * dur + 0.02);
    });
  } catch (e) { /* звук недоступен */ }
}
const playOk = () => tone([523, 659, 784, 1047], 0.13, "triangle");
const playBad = () => tone([260, 190], 0.22, "sawtooth", 0.12);

function Confetti({ count = 60 }) {
  const pieces = useMemo(() => {
    const colors = ["#ef4444", "#f59e0b", "#22c55e", "#3b82f6", "#a855f7", "#ec4899", "#facc15"];
    return Array.from({ length: count }, (_, i) => ({
      left: Math.random() * 100,
      delay: Math.random() * 0.8,
      dur: 2.2 + Math.random() * 1.8,
      color: colors[i % colors.length],
      round: Math.random() > 0.5,
    }));
  }, [count]);
  return (
    <>
      {pieces.map((p, i) => (
        <span key={i} className="confetti"
          style={{ left: p.left + "%", background: p.color, animationDelay: p.delay + "s", animationDuration: p.dur + "s", borderRadius: p.round ? "50%" : "2px" }} />
      ))}
    </>
  );
}

function QuestionModal({ entry, allDone, onResult, onClose }) {
  const { id, topic, item } = entry;
  const isText = item.mode === "text";
  const limit = isText ? TEXT_TIME : TIME_LIMIT;
  const options = useMemo(() => (isText ? [] : shuffle(item.options)), [id]);
  const praise = useMemo(() => PRAISE[Math.floor(Math.random() * PRAISE.length)], [id]);
  const [picked, setPicked] = useState(null);
  const [reason, setReason] = useState(null);      // correct | wrong | timeout
  const [done, setDone] = useState(false);
  const [left, setLeft] = useState(limit);
  const [text, setText] = useState("");
  const textRef = useRef("");
  const deadline = useRef(Date.now() + limit * 1000);
  const doneRef = useRef(false);
  const doneAt = useRef(0);
  const resultRef = useRef(null);

  const finish = (choice, why) => {
    if (doneRef.current) return;
    doneRef.current = true;
    doneAt.current = Date.now();
    const ok = isText ? isCorrect(choice, item.accept) : choice === item.answer;
    const r = ok ? "correct" : why || "wrong";
    setPicked(choice); setReason(r); setDone(true);
    onResult(id, ok, r);
    ok ? playOk() : playBad();
  };

  useEffect(() => {
    const t = setInterval(() => {
      if (doneRef.current) return;
      const l = Math.max(0, (deadline.current - Date.now()) / 1000);
      setLeft(l);
      if (l <= 0) finish(isText ? textRef.current : null, "timeout");   // что успел вписать — то и засчитываем
    }, 100);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (done && resultRef.current) resultRef.current.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }, [done]);

  useEffect(() => {
    const onKey = (e) => {
      if (!doneRef.current) {
        if (isText) return;
        const n = parseInt(e.key, 10);
        if (n >= 1 && n <= options.length) finish(options[n - 1], "wrong");
      } else if (e.key === "Enter" && Date.now() - doneAt.current > 700) onClose();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [options]);

  const submitText = () => { if (text.trim()) finish(text.trim(), "wrong"); };

  const elapsed = limit - left;
  const secs = Math.ceil(left);
  const pct = (left / limit) * 100;
  const low = left <= 10 && !done;
  const barColor = left > limit / 2 ? "#22c55e" : left > 10 ? "#f59e0b" : "#ef4444";
  const isOk = reason === "correct";
  const qLines = item.q ? item.q.split("\n") : [];
  const longList = qLines.length > 1;
  const hasHint = isText && !item.qImg && item.img;           // картинка-подсказка (у ребусов картинка — сам вопрос)
  const hintShown = hasHint && (elapsed >= HINT_AT || done);
  const hintWait = Math.max(1, Math.ceil(HINT_AT - elapsed));

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6"
      style={{ background: "rgba(40,20,0,.72)", backdropFilter: "blur(3px)" }} role="dialog" aria-modal="true">
      {isOk && <Confetti count={70} />}
      <div className="card relative w-full max-w-2xl max-h-[94vh] overflow-y-auto p-4 sm:p-6 pop">
        {isOk && <div className="plus-fly">+{item.pts} баллов</div>}

        {/* шапка вопроса */}
        <div className="flex items-center justify-between gap-3">
          <div className="min-w-0">
            <div className="text-sm font-extrabold truncate" style={{ color: "var(--ink-soft)" }}>{topic.icon} {topic.title}</div>
            <div className="font-black text-lg" style={{ color: "var(--brand)" }}>за {item.pts} баллов</div>
          </div>
          <div className={"flex-none text-center " + (low ? "timer-low" : "")} style={{ minWidth: "4.5rem" }}>
            <div className="text-3xl font-black tabular-nums" style={{ color: low ? "#ef4444" : "var(--ink)" }}>
              ⏱ {secs}
            </div>
          </div>
        </div>

        {/* полоса времени */}
        <div className="mt-2 h-3 rounded-full overflow-hidden" style={{ background: "var(--card-2)", border: "2px solid var(--line)" }}>
          <div className="h-full rounded-full" style={{ width: pct + "%", background: barColor, transition: "width .1s linear, background .3s" }} />
        </div>

        {/* вопрос */}
        <p className="mt-4 text-sm font-bold" style={{ color: "var(--ink-soft)" }}>{topic.prompt}</p>
        {item.qImg && (
          <div className="mt-2 flex justify-center rounded-xl overflow-hidden bg-white" style={{ border: "2px solid var(--line)" }}>
            {item.qImg.map((k) => <img key={k} src={IMG[k]} alt="" className="max-h-56 w-auto max-w-full object-contain" />)}
          </div>
        )}
        {item.q && !longList && <h2 className="mt-2 text-2xl sm:text-3xl font-black leading-snug">{item.q}</h2>}
        {item.q && longList && (
          <ul className="mt-2 space-y-2 text-base sm:text-lg font-bold leading-snug">
            {qLines.map((l, i) => (
              <li key={i} className="rounded-xl px-3 py-2" style={{ background: "var(--card-2)", border: "2px solid var(--line)" }}>{l}</li>
            ))}
          </ul>
        )}

        {/* картинка-подсказка: появляется через 20 секунд */}
        {hasHint && (
          hintShown ? (
            <div className="mt-3 pop">
              <div className="text-xs font-extrabold mb-1" style={{ color: "var(--ink-soft)" }}>💡 Подсказка</div>
              <div className="flex flex-wrap justify-center gap-2">
                {item.img.map((k) => (
                  <img key={k} src={IMG[k]} alt="подсказка" className="max-h-44 w-auto rounded-xl bg-white" style={{ border: "2px solid var(--line)" }} />
                ))}
              </div>
            </div>
          ) : (
            <div className="mt-3 rounded-xl py-4 text-center font-bold text-sm"
              style={{ background: "var(--card-2)", border: "2px dashed var(--line)", color: "var(--ink-soft)" }}>
              💡 Картинка-подсказка появится через {hintWait} сек
            </div>
          )
        )}

        {/* ответ: текстовое поле (раунд 1) или варианты (раунды 2–3) */}
        {isText ? (
          <div className="mt-4">
            <label className="block text-sm font-extrabold mb-1" htmlFor="ans">Твой ответ</label>
            <div className="flex gap-2">
              <input
                id="ans" autoFocus autoComplete="off" autoCapitalize="none" spellCheck="false"
                value={text} disabled={done} maxLength={60}
                onChange={(e) => { setText(e.target.value); textRef.current = e.target.value; }}
                onKeyDown={(e) => e.key === "Enter" && submitText()}
                placeholder="Впиши ответ и нажми Enter"
                className="flex-1 min-w-0 rounded-xl px-4 py-3 text-lg font-bold outline-none"
                style={{
                  background: done ? (isOk ? "var(--ok-bg)" : "var(--bad-bg)") : "var(--card-2)",
                  color: done ? (isOk ? "var(--ok)" : "var(--bad)") : "var(--ink)",
                  border: "3px solid " + (done ? (isOk ? "var(--ok)" : "var(--bad)") : "var(--line)"),
                }}
              />
              <button className="btn flex-none" disabled={done || !text.trim()} onClick={submitText}>Ответить</button>
            </div>
          </div>
        ) : (
          <div className="mt-4 grid gap-2.5">
            {options.map((opt, i) => {
              let cls = "opt";
              if (done) {
                if (opt === item.answer) cls += " opt-ok";
                else if (opt === picked) cls += " opt-bad";
                else cls += " opt-dim";
              }
              return (
                <button key={opt} className={cls} disabled={done} onClick={() => finish(opt, "wrong")}>
                  <span className="letter">{LETTERS[i]}</span>
                  <span className="flex-1">{opt}</span>
                  {done && opt === item.answer && <span className="text-2xl">✅</span>}
                  {done && opt === picked && opt !== item.answer && <span className="text-2xl">❌</span>}
                </button>
              );
            })}
          </div>
        )}

        {/* результат */}
        {done && (
          <div ref={resultRef} className="mt-4 pop">
            {isOk ? (
              <div className="rounded-2xl p-4 text-center" style={{ background: "var(--ok-bg)", border: "3px solid var(--ok)", color: "var(--ok)" }}>
                <div className="text-4xl font-black">🎉 {praise}</div>
                <div className="mt-1 text-2xl font-black">+{item.pts} баллов</div>
                {isText && <div className="mt-1 text-lg font-bold">Ответ: {item.note || item.answer}</div>}
              </div>
            ) : (
              <div className="rounded-2xl p-4 text-center" style={{ background: "var(--bad-bg)", border: "3px solid var(--bad)", color: "var(--bad)" }}>
                <div className="text-3xl font-black">{reason === "timeout" ? "⏰ Время вышло!" : "😔 Неверно"}</div>
                {isText && picked && <div className="mt-1 text-base font-bold">Твой ответ: «{picked}»</div>}
                <div className="mt-1 text-lg font-bold">Баллы не начислены. Правильный ответ:</div>
                <div className="mt-1 text-2xl font-black">{item.note || item.answer}</div>
              </div>
            )}

            {!isText && item.img && (
              <div className="mt-3 flex flex-wrap justify-center gap-2">
                {item.img.map((k) => (
                  <img key={k} src={IMG[k]} alt={item.answer} className="max-h-44 w-auto rounded-xl bg-white" style={{ border: "2px solid var(--line)" }} />
                ))}
              </div>
            )}

            <button className="btn w-full mt-4 text-lg" onClick={onClose}>
              {allDone ? "Показать результат 🏆" : "Вернуться к полю →"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

      <div className="mt-4 text-center max-w-xl">
        <p className="font-black text-lg" style={{ color: "#fff", textShadow: "0 2px 6px rgba(0,0,0,.45)" }}>
          📸 Сделай скриншот карточки с результатом и отправь учителю
        </p>
        <button className="btn-ghost mt-3" onClick={onRestart}>↻ Начать заново (новый игрок)</button>
      </div>
    </div>
  );
}

/* ============================================================
   ПРИЛОЖЕНИЕ
   ============================================================ */
function App() {
  const [state, setState] = useState(loadState);
  const [activeId, setActiveId] = useState(null);
  const [confirmReset, setConfirmReset] = useState(false);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* хранилище недоступно */ }
  }, [state]);

  const score = useMemo(
    () => Object.entries(state.answered).reduce((s, [id, a]) => s + (a.ok && BY_ID[id] ? BY_ID[id].item.pts : 0), 0),
    [state.answered]
  );
  const answeredCount = Object.keys(state.answered).length;
  const allDone = answeredCount >= TOTAL_Q;

  const start = (name) => setState({ ...emptyState, name });
  const open = (id) => { setState((s) => ({ ...s, pending: id })); setActiveId(id); };
  const onResult = (id, ok, reason) =>
    setState((s) => {
      const answered = { ...s.answered, [id]: { ok, reason } };
      const fin = Object.keys(answered).length >= TOTAL_Q ? s.finishedAt || Date.now() : s.finishedAt;
      return { ...s, answered, pending: null, finishedAt: fin };
    });
  const reset = () => { setState(emptyState); setActiveId(null); setConfirmReset(false); };

  if (!state.name) return <StartScreen onStart={start} />;

  if (allDone && !activeId) {
    return <FinalScreen state={state} score={score} onMood={(m) => setState((s) => ({ ...s, mood: m }))} onRestart={reset} />;
  }

  return (
    <div className="max-w-4xl mx-auto px-3 pb-10">
      {/* постоянная шапка со счётом */}
      <header className="sticky z-30 pt-3 pb-3" style={{ top: "env(safe-area-inset-top, 0px)" }}>
        <div className="card flex items-center gap-3 px-3 sm:px-5 py-2.5">
          <div className="min-w-0 flex-1">
            <div className="brand-title font-black text-lg sm:text-xl leading-tight">🎓 Мир профессий</div>
            <div className="text-sm font-extrabold truncate">👤 {state.name}</div>
          </div>
          <div className="text-center flex-none">
            <div className="text-xs font-bold" style={{ color: "var(--ink-soft)" }}>Счёт</div>
            <div className="text-3xl font-black leading-none tabular-nums" style={{ color: "var(--brand)" }}>
              ⭐ <span key={score} className="bump">{score}</span>
            </div>
          </div>
          <div className="text-center flex-none hidden sm:block">
            <div className="text-xs font-bold" style={{ color: "var(--ink-soft)" }}>Вопросов</div>
            <div className="text-xl font-black tabular-nums">{answeredCount}/{TOTAL_Q}</div>
          </div>
          <button className="btn-ghost flex-none" onClick={() => setConfirmReset(true)} title="Начать заново">↻</button>
        </div>
        <div className="sm:hidden mt-2 h-2 rounded-full overflow-hidden" style={{ background: "var(--card-2)", border: "1px solid var(--line)" }}>
          <div className="h-full" style={{ width: (answeredCount / TOTAL_Q) * 100 + "%", background: "var(--brand-2)", transition: "width .4s" }} />
        </div>
      </header>

      <Board state={state} score={score} onOpen={open} />

      <p className="text-center mt-5 font-bold text-sm" style={{ color: "#fff", textShadow: "0 1px 4px rgba(0,0,0,.5)" }}>
        Выбери тему и количество баллов. Уже сыгранные вопросы закрыты.
      </p>

      {activeId && (
        <QuestionModal
          key={activeId}
          entry={BY_ID[activeId]}
          allDone={allDone}
          onResult={onResult}
          onClose={() => setActiveId(null)}
        />
      )}

      {confirmReset && (
        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4" style={{ background: "rgba(40,20,0,.7)" }}>
          <div className="card p-5 max-w-sm w-full text-center pop">
            <div className="text-4xl">↻</div>
            <div className="mt-2 font-black text-xl">Начать заново?</div>
            <p className="mt-1 text-sm font-bold" style={{ color: "var(--ink-soft)" }}>Весь прогресс и набранные баллы будут сброшены.</p>
            <div className="mt-4 flex gap-3 justify-center">
              <button className="btn-ghost" onClick={() => setConfirmReset(false)}>Отмена</button>
              <button className="btn" style={{ padding: ".5rem 1.2rem" }} onClick={reset}>Да, сбросить</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
